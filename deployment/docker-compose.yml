# Based on msensor compose file. 

services:

  mslam:
    image: mdnf1992/mslam
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    init: true
    restart: unless-stopped

    network_mode: host
    volumes:
      - "./config/:/config"
    command: ["mslam", "-c", "/config/mslam.jsonc"]

  mslam-viewer:
    image: mdnf1992/mslam-viewer
    build:
      context: ..
      dockerfile: deployment/DockerfileViewer
    init: true
    restart: unless-stopped
    network_mode: host

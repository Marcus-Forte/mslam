syntax = "proto3";

package sensors;

import "lidar.proto";

message Empty {
}

message Pose3D {
	double x = 1;
	double y = 2;
	double z = 3;
	double phi = 4;
	double omega = 5;
	double theta = 6;
}

message MapStreamRequest {
	// Resume position from an earlier stream. Leave both at 0 to start from the
	// beginning. If `epoch` is not the server's current epoch, `start_offset`
	// is ignored and the stream starts at offset 0.
	uint64 epoch = 1;
	uint64 start_offset = 2;
	// Upper bound on points per chunk. 0 selects the server default.
	uint32 max_points_per_chunk = 3;
}

message MapStreamChunk {
	// Identifies one generation of the map. It changes on every SLAM reset and
	// differs between server processes. Never 0.
	uint64 epoch = 1;
	// The chunk holds the increments [first_offset, next_offset), in order.
	uint64 first_offset = 2;
	// Offset to resume from once this chunk has been applied.
	uint64 next_offset = 3;
	PointCloud3 points = 4;
}

// Position and orientation of a frame, as viser takes them: `position` and the
// unit quaternion `wxyz` (Hamilton convention, w first, rotation of the frame
// into its parent). A quaternion has no gimbal singularity, unlike the Euler
// angles of Pose3D.
message PoseQuat {
	double x = 1;
	double y = 2;
	double z = 3;
	double qw = 4;
	double qx = 5;
	double qy = 6;
	double qz = 7;
}

// Pose-graph strategy. Resume position of a StreamKeyframes call. Leave both
// at 0 to start from the beginning. If `epoch` is not the server's current
// keyframe epoch, `next_keyframe_id` is ignored and the stream starts at 0.
message KeyframeStreamRequest {
	uint64 epoch = 1;
	// The first keyframe id the client does not have yet.
	uint64 next_keyframe_id = 2;
}

// First message of a stream, and again whenever the server is reset: the
// keyframe epoch changed, so the client drops every keyframe it holds.
message KeyframeEpoch {
	uint64 epoch = 1;
}

// A keyframe, sent once. Ids are consecutive from 0 in each epoch.
message KeyframeAdded {
	uint64 epoch = 1;
	uint64 id = 2;
	// Pose in the map frame when the keyframe was added; a later KeyframePoses
	// supersedes it.
	PoseQuat pose = 3;
	// The keyframe's mini map in the keyframe's OWN frame: place it with `pose`.
	PointCloud3 cloud = 4;
}

// The current map-frame pose of keyframes [0, n), sent when an optimization
// moved them (and once after a client resumes). Only poses: no points.
message KeyframePoses {
	uint64 epoch = 1;
	// Increases with every result of the back end (also reported by GetStatus).
	uint64 graph_version = 2;
	repeated KeyframePoseEntry poses = 3;
}

message KeyframePoseEntry {
	uint64 id = 1;
	PoseQuat pose = 2;
}

message KeyframeStreamMessage {
	oneof payload {
		KeyframeEpoch epoch_reset = 1;
		KeyframeAdded added = 2;
		KeyframePoses poses = 3;
	}
}

// State of the SLAM server's link to its sensor server.
enum SensorLink {
	// The server cannot tell (no sensor status source attached).
	SENSOR_LINK_UNKNOWN = 0;
	// The sensor is on-board (remote_scanner "local"); there is no link.
	SENSOR_LINK_NOT_APPLICABLE = 1;
	// The sensor server is unreachable.
	SENSOR_LINK_DISCONNECTED = 2;
	// Connected, but LiDAR and IMU samples are not both arriving (for example a
	// paused playback server).
	SENSOR_LINK_CONNECTED_IDLE = 3;
	// Connected and both LiDAR and IMU samples are arriving.
	SENSOR_LINK_STREAMING = 4;
}

enum SlamStrategy {
	SLAM_STRATEGY_ODOMETRY = 0;
	SLAM_STRATEGY_POSE_GRAPH = 1;
}

message SlamStatus {
	SensorLink sensor_link = 1;
	// Sensor server the SLAM server connects to ("host:port"); empty when none.
	string sensor_address = 2;
	// Milliseconds since the last LiDAR scan / IMU sample arrived; -1 if none
	// has arrived yet (or the sensor is not remote).
	int32 scan_age_ms = 3;
	int32 imu_age_ms = 4;
	// Estimator in use (config slam.strategy).
	SlamStrategy strategy = 5;
	// Pose-graph strategy only (0 otherwise): increases with every new result of
	// the back end; keyframes in the graph; accepted loop closures.
	uint64 graph_version = 6;
	uint32 keyframes = 7;
	uint32 loop_closures = 8;
}

service SlamService {
	// Deprecated: use StreamMap. Joins the whole map into one message.
	rpc GetMap(Empty) returns (PointCloud3);
	// Deprecated: use StreamMap. Streams only the latest increment, so it
	// skips increments that arrive while a message is being sent.
	rpc GetMapIncrements(Empty) returns (stream PointCloud3);
	// Cursor-based map stream: every increment from the cursor on, in order.
	rpc StreamMap(MapStreamRequest) returns (stream MapStreamChunk);
	// Pose-graph strategy: keyframes with their mini maps (once each, in the
	// keyframe frame) and the optimized poses, so that a loop closure re-sends
	// poses and not points. With the odometry strategy the stream announces its
	// epoch and stays silent.
	rpc StreamKeyframes(KeyframeStreamRequest) returns (stream KeyframeStreamMessage);
	rpc GetTransformedScan(Empty) returns (stream PointCloud3);
	rpc GetCorrespondences(Empty) returns (stream PointCloud3);
	rpc GetPose(Empty) returns (stream Pose3D);
	rpc Stop(Empty) returns (Empty);
	rpc Start(Empty) returns (Empty);
	rpc Reset(Empty) returns (Empty);
	// One-shot status, cheap enough to poll about once per second.
	rpc GetStatus(Empty) returns (SlamStatus);
}




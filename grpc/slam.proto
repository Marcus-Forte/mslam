syntax = "proto3";

package sensors;

import "lidar.proto";

message Empty {
}

message Pose3D {
	double x = 1;
	double y = 2;
	double z = 3;
	double phi = 4;
	double omega = 5;
	double theta = 6;
}

message MapStreamRequest {
	// Resume position from an earlier stream. Leave both at 0 to start from the
	// beginning. If `epoch` is not the server's current epoch, `start_offset`
	// is ignored and the stream starts at offset 0.
	uint64 epoch = 1;
	uint64 start_offset = 2;
	// Upper bound on points per chunk. 0 selects the server default.
	uint32 max_points_per_chunk = 3;
}

message MapStreamChunk {
	// Identifies one generation of the map. It changes on every SLAM reset and
	// differs between server processes. Never 0.
	uint64 epoch = 1;
	// The chunk holds the increments [first_offset, next_offset), in order.
	uint64 first_offset = 2;
	// Offset to resume from once this chunk has been applied.
	uint64 next_offset = 3;
	PointCloud3 points = 4;
}

// State of the SLAM server's link to its sensor server.
enum SensorLink {
	// The server cannot tell (no sensor status source attached).
	SENSOR_LINK_UNKNOWN = 0;
	// The sensor is on-board (remote_scanner "local"); there is no link.
	SENSOR_LINK_NOT_APPLICABLE = 1;
	// The sensor server is unreachable.
	SENSOR_LINK_DISCONNECTED = 2;
	// Connected, but LiDAR and IMU samples are not both arriving (for example a
	// paused playback server).
	SENSOR_LINK_CONNECTED_IDLE = 3;
	// Connected and both LiDAR and IMU samples are arriving.
	SENSOR_LINK_STREAMING = 4;
}

message SlamStatus {
	SensorLink sensor_link = 1;
	// Sensor server the SLAM server connects to ("host:port"); empty when none.
	string sensor_address = 2;
	// Milliseconds since the last LiDAR scan / IMU sample arrived; -1 if none
	// has arrived yet (or the sensor is not remote).
	int32 scan_age_ms = 3;
	int32 imu_age_ms = 4;
}

service SlamService {
	// Deprecated: use StreamMap. Joins the whole map into one message.
	rpc GetMap(Empty) returns (PointCloud3);
	// Deprecated: use StreamMap. Streams only the latest increment, so it
	// skips increments that arrive while a message is being sent.
	rpc GetMapIncrements(Empty) returns (stream PointCloud3);
	// Cursor-based map stream: every increment from the cursor on, in order.
	rpc StreamMap(MapStreamRequest) returns (stream MapStreamChunk);
	rpc GetTransformedScan(Empty) returns (stream PointCloud3);
	rpc GetCorrespondences(Empty) returns (stream PointCloud3);
	rpc GetPose(Empty) returns (stream Pose3D);
	rpc Stop(Empty) returns (Empty);
	rpc Start(Empty) returns (Empty);
	rpc Reset(Empty) returns (Empty);
	// One-shot status, cheap enough to poll about once per second.
	rpc GetStatus(Empty) returns (SlamStatus);
}




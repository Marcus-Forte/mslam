[project]
name = "msim"
version = "0.1.0"
description = "MuJoCo-based Livox Mid360 + IMU simulator that serves the msensor gRPC streams to mslam"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "mujoco>=3.2",
    "numpy>=2.0",
    "grpcio>=1.66",
    "protobuf>=5",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "grpcio-tools>=1.66",
]

[project.scripts]
msim = "msim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
